<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="384" viewBox="0 0 1200 384" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
<title id="title">Estrutura de calculadora-react</title>
<desc id="desc">src/: código da aplicação · main/: Calculator: lógica principal · components/: Button e Display · fonts/: fonte Roboto Mono · App.js: componente raiz · public/: index.html e ícones · assets/: prévia em GIF e imagem · package.json: dependências e scripts</desc>
<style>
.mono{font-family:'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'DejaVu Sans Mono', 'Courier New', monospace}
text{shape-rendering:auto}
</style>
<defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#ffffff" opacity=".06"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".22"/></pattern>
<clipPath id="card"><rect width="1200" height="384" rx="10"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="1200" height="384" fill="#191817"/>
<rect width="1200" height="384" fill="url(#grid)"/>
<rect width="1200" height="40" fill="#262422"/>
<rect y="40" width="1200" height="1" fill="#3a3733"/>
<rect x="20" y="14" width="12" height="12" fill="#e5534b"/>
<rect x="40" y="14" width="12" height="12" fill="#e0a43b"/>
<rect x="60" y="14" width="12" height="12" fill="#5fb85f"/>
<text x="600" y="25" text-anchor="middle" class="mono" font-size="14" fill="#86817a">estrutura</text>
<text x="48" y="88" class="mono" font-size="15" fill="#d97757">$</text>
<text x="66" y="88" class="mono" font-size="15" fill="#ece9e4">tree calculadora-react</text>
<text x="48" y="128" class="mono" font-size="15" font-weight="700" fill="#d97757">calculadora-react/</text>
<text x="48" y="154" class="mono" font-size="15" fill="#5c5852" xml:space="preserve">├── <tspan fill="#d97757" font-weight="700">src/</tspan></text>
<text x="246" y="154" class="mono" font-size="14" fill="#86817a"># código da aplicação</text>
<text x="48" y="180" class="mono" font-size="15" fill="#5c5852" xml:space="preserve">│   ├── <tspan fill="#d97757" font-weight="700">main/</tspan></text>
<text x="246" y="180" class="mono" font-size="14" fill="#86817a"># Calculator: lógica principal</text>
<text x="48" y="206" class="mono" font-size="15" fill="#5c5852" xml:space="preserve">│   ├── <tspan fill="#d97757" font-weight="700">components/</tspan></text>
<text x="246" y="206" class="mono" font-size="14" fill="#86817a"># Button e Display</text>
<text x="48" y="232" class="mono" font-size="15" fill="#5c5852" xml:space="preserve">│   ├── <tspan fill="#d97757" font-weight="700">fonts/</tspan></text>
<text x="246" y="232" class="mono" font-size="14" fill="#86817a"># fonte Roboto Mono</text>
<text x="48" y="258" class="mono" font-size="15" fill="#5c5852" xml:space="preserve">│   └── <tspan fill="#ece9e4">App.js</tspan></text>
<text x="246" y="258" class="mono" font-size="14" fill="#86817a"># componente raiz</text>
<text x="48" y="284" class="mono" font-size="15" fill="#5c5852" xml:space="preserve">├── <tspan fill="#d97757" font-weight="700">public/</tspan></text>
<text x="246" y="284" class="mono" font-size="14" fill="#86817a"># index.html e ícones</text>
<text x="48" y="310" class="mono" font-size="15" fill="#5c5852" xml:space="preserve">├── <tspan fill="#d97757" font-weight="700">assets/</tspan></text>
<text x="246" y="310" class="mono" font-size="14" fill="#86817a"># prévia em GIF e imagem</text>
<text x="48" y="336" class="mono" font-size="15" fill="#5c5852" xml:space="preserve">└── <tspan fill="#ece9e4">package.json</tspan></text>
<text x="246" y="336" class="mono" font-size="14" fill="#86817a"># dependências e scripts</text>
<rect width="1200" height="384" fill="url(#scan)"/>
</g>
<rect x=".5" y=".5" width="1199" height="383" rx="9.5" fill="none" stroke="#3a3733"/>
</svg>
