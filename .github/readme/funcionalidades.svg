<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
<title id="title">Funcionalidades de calculadora-react</title>
<desc id="desc">Operações básicas: Soma, subtração, multiplicação e divisão, com números decimais; divisão por zero não quebra a conta. · Operações encadeadas: Em 10 + 10 + 5, a operação anterior é calculada sozinha e o fluxo da conta continua. · Suporte ao teclado: Números, operadores, Enter para o resultado e Esc para limpar, sem precisar do mouse. · Display dinâmico: Atualiza em tempo real; ao apertar = mostra só o resultado e limpa sozinho no próximo número. · Componentes: Button, Display e Calculator separados, cada um com seu próprio CSS. · Interface responsiva: Layout moderno em grade, com fonte Roboto Mono e link para o GitHub no rodapé.</desc>
<style>
.mono{font-family:'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'DejaVu Sans Mono', 'Courier New', monospace}
text{shape-rendering:auto}
</style>
<defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#ffffff" opacity=".06"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".22"/></pattern>
<clipPath id="card"><rect width="1200" height="490" rx="10"/></clipPath>
</defs>
